name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # The root checks only itself; the app's tracked copy needs the framework, which only the workspace has.
      - run: rm -rf packages
      # Node 22's bundled npm 10 crashes resolving this tree's peers (reading 'edgesOut'); the workspace runs npm 11.
      - run: npm install -g npm@11
      - run: npm install
      - run: npm run tsc
      - run: npm test
      - run: npm run lint
