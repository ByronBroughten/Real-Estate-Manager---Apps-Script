name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # No lockfile: install resolves fresh, so dependency drift shows up here.
      - run: npm install
      - run: npm run tsc
      - run: npm run test:coverage
      - run: npm run lint
      - run: npm run lint:docs
